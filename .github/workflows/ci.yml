name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e ".[providers,dev]"
      - name: Run release acceptance gate
        run: python scripts/acceptance.py

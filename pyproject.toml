[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "medboard-ai"
version = "0.1.0"
description = "Interactive multi-agent medical diagnostic decision-support board"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MedBoard AI contributors" }]
dependencies = [
    "chromadb>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "pypdf>=5.0,<7",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "streamlit>=1.48,<2",
]

[project.scripts]
medboard = "medboard.cli:main"
medboard-evaluate = "medboard.evaluation.__main__:main"

[project.optional-dependencies]
workflow = [
    "langchain>=1.0,<2",
]
providers = [
    "google-genai>=1.0,<2",
    "openai>=2.0,<3",
]
dev = [
    "flake8>=7.3,<8",
    "flake8-bugbear>=24.12,<26",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
]

[tool.setuptools.packages.find]
include = ["medboard*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "chromadb",
    "chromadb.*",
    "langgraph",
    "langgraph.*",
    "pypdf",
    "openai",
    "openai.*",
    "google.genai",
    "google.genai.*",
    "streamlit",
    "streamlit.*",
]
follow_imports = "skip"

[tool.coverage.run]
source = ["medboard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
